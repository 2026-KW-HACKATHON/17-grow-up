spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/growup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:growup}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  forward-headers-strategy: framework

openapi:
  server-url: ${OPENAPI_SERVER_URL:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  qr-token-expiration-seconds: ${JWT_QR_TOKEN_EXPIRATION_SECONDS:300}

app:
  invite:
    base-url: ${INVITE_BASE_URL:https://17-grow-up.vercel.app/invite}